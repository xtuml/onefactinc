---
layout: default
---
<article class="article-page">
  <header class="page-hero">
    <div class="container">
      <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">BLOG</a></p>
      <h1>{{ page.title | escape }}</h1>
      {% if page.date %}<p class="article-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>{% endif %}
    </div>
  </header>
  <div class="section">
    <div class="container narrow article-content">
      {{ content }}
      <p><a href="{{ '/blog/' | relative_url }}">← Back to all articles</a></p>
    </div>
  </div>
</article>
