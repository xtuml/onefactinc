title: One Fact
description: Systems modeling, embedded control, and xtUML expertise.
url: "https://xtuml.github.io"
baseurl: "/onefactinc"

markdown: kramdown
permalink: pretty

collections:
  articles:
    output: true
    sort_by: title
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: article

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - MIGRATION-INVENTORY.md
